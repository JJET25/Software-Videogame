<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/frontend/CSS/login.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DD - Sing up</title>
  </head>
  <body>
    <div class="loading-overlay">
      <div class="spinner"></div>
    </div>

    <!-- Logo -->
    <div class="login__container">
      <div class="logo__container">
        <h1>
          <img
            src="../../Assets/Website/DimensionDeck_Logo.png"
            alt="Dimension Deck"
          />
        </h1>
      </div>

      <!-- Tab switcher -->
      <div class="tabs__container">
        <button class="tab-active" data-tab="login">LOG IN</button>
        <button class="tab" data-tab="signup">SIGN UP</button>
      </div>

      <!-- LOG IN FORM-->
      <form id="loginForm">
        <div class="input__container">
          <label for="username">Username:</label>
          <input type="text" name="username" id="username" />
        </div>

        <div class="input__container">
          <label for="password">Password:</label>
          <input type="password" name="password" id="password" />
        </div>

        <p class="error-msg" id="errorMsgLogin">
          LOG IN ERROR: Check your user or password
        </p>
        <button type="submit">LOG IN</button>
      </form>

      <!-- SIGN UP FORM -->
      <form id="signupForm">
        <div class="input__container">
          <label for="signup-username">Username:</label>
          <input type="text" name="username" id="signup-username" />
        </div>

        <div class="input__container">
          <label for="signup-email">Email:</label>
          <input type="email" name="email" id="signup-email" />
        </div>

        <div class="input__container">
          <label for="signup-password">Password:</label>
          <input type="password" name="password" id="signup-password" />
        </div>

        <p class="error-msg" id="errorMsgSignup">
          SIGN UP ERROR: Create account fail
        </p>
        <button type="submit">SIGN UP</button>
      </form>

      <a href="/index.html">Back to the menu</a>
    </div>

    <script src="../JavaScript/login.js"></script>
  </body>
</html>
